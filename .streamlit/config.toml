[server]
headless = true
runOnSave = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 500
maxMessageSize = 500

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#0f766e"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ecfdf5"
textColor = "#0f172a"
font = "sans serif"

[browser]
gatherUsageStats = false
